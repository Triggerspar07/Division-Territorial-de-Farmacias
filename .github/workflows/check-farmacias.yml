name: Sync farmacias from source map
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync only FARMACIAS array
        shell: python
        run: |
          import copy, json, re, unicodedata, urllib.request
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          m = re.search(r'const FARMACIAS = (\[.*?\]);\s*let currentDeptoIdx', html, re.S)
          if not m:
              raise SystemExit('No se encontró const FARMACIAS')
          current = json.loads(m.group(1))

          src_html = urllib.request.urlopen(
              'https://raw.githubusercontent.com/Triggerspar07/Mapa-de-DoctorSV/main/index.html',
              timeout=30
          ).read().decode('utf-8')
          m2 = re.search(r'const SUCURSALES_REALES = (\[.*?\]);', src_html, re.S)
          if not m2:
              raise SystemExit('No se encontró SUCURSALES_REALES')
          src = json.loads(m2.group(1))
          source = [x for x in src if x.get('tipo') == 'farmacia']

          def norm(s):
              s = unicodedata.normalize('NFD', str(s or ''))
              s = ''.join(ch for ch in s if unicodedata.category(ch) != 'Mn')
              s = re.sub(r'[^a-z0-9]+', ' ', s.lower())
              return re.sub(r'\s+', ' ', s).strip()

          def key(x):
              return (norm(x.get('nombre')), norm(x.get('cadena')), norm(x.get('direccion')))

          current_by_key = {key(x): x for x in current}
          used_keys = set()

          # Datos directos del JSON de sucursales para las 3 farmacias nuevas.
          new_json = {
              'FARMACIA LA BUENA N° 53': {
                  'codigo': 'E10F1519', 'telefono': '7921-4542',
                  'horario_lv': '09:00 AM A 08:00 PM', 'horario_sab': '09:00 AM A 08:00 PM', 'horario_dom': 'CERRADO'
              },
              'FARMACIAS ECONOMICAS PUMA SANTA MARIA': {
                  'codigo': 'E10F2252', 'telefono': '2530-2530',
                  'horario_lv': '08:00 AM A 10:00 PM', 'horario_sab': '08:00 AM A 10:00 PM', 'horario_dom': '09:00 AM A 09:00 PM'
              },
              'FARMACIA SAN NICOLAS 29 CALLE PONIENTE': {
                  'codigo': 'E10F1993', 'telefono': '2555-5555',
                  'horario_lv': '07:45 AM A 10:00 PM', 'horario_sab': '07:45 AM A 10:00 PM', 'horario_dom': '08:30 AM A 07:00 PM'
              },
          }

          def parse_horario(h):
              out = {}
              for part in [p.strip() for p in str(h or '').split('·')]:
                  if ':' not in part:
                      continue
                  label, value = part.split(':', 1)
                  nl = norm(label)
                  if 'lun' in nl or 'vie' in nl:
                      out['horario_lv'] = value.strip()
                  elif 'sab' in nl:
                      out['horario_sab'] = value.strip()
                  elif 'dom' in nl:
                      out['horario_dom'] = value.strip()
              return out

          result = []
          for src_rec in source:
              k = key(src_rec)
              # Recupera registros ya existentes aun cuando solo difieran en
              # mayúsculas, tildes, puntuación o espacios.
              rec = copy.deepcopy(current_by_key.get(k, {}))
              used_keys.add(k)

              rec['cadena'] = src_rec.get('cadena', rec.get('cadena', ''))
              rec['nombre'] = src_rec.get('nombre', rec.get('nombre', ''))
              rec['direccion'] = src_rec.get('direccion', rec.get('direccion', ''))
              rec['municipio'] = src_rec.get('municipio', rec.get('municipio', ''))
              rec['departamento'] = src_rec.get('departamento', rec.get('departamento', ''))
              rec['distrito'] = src_rec.get('distrito', rec.get('distrito', ''))
              rec['lat'] = src_rec.get('lat', rec.get('lat'))
              rec['lon'] = src_rec.get('lng', rec.get('lon'))
              rec['abierto24'] = bool(src_rec.get('abierto24h', rec.get('abierto24', False)))
              rec['inyectologia'] = bool(src_rec.get('servicioInyectologia', rec.get('inyectologia', False)))
              rec['controlados'] = bool(src_rec.get('dispensacionControlados', rec.get('controlados', False)))
              rec['biologicos'] = bool(src_rec.get('medicamentosBiologicos', rec.get('biologicos', False)))

              if src_rec.get('activo') is False:
                  rec['estatus'] = 'INACTIVO TEMPORAL' if 'temporal' in norm(src_rec.get('estadoInactivo')) else 'INACTIVO'
              else:
                  rec['estatus'] = 'ACTIVO'

              # Mantener teléfono y horarios existentes; para las 3 nuevas,
              # usar directamente los datos del JSON fuente.
              extra = new_json.get(src_rec.get('nombre'))
              if extra:
                  rec.update(extra)
              else:
                  rec.update(parse_horario(src_rec.get('horario')))
                  rec.setdefault('telefono', rec.get('telefono', ''))
                  rec.setdefault('codigo', rec.get('codigo', str(src_rec.get('id', ''))))

              if src_rec.get('coordenadaAproximada'):
                  rec['confianza_estimado'] = True

              result.append(rec)

          # Conserva cualquier registro local que no haya encontrado por clave,
          # evitando borrados no solicitados.
          for rec in current:
              if key(rec) not in used_keys:
                  result.append(rec)

          # Verificación de las 3 nuevas esperadas.
          names = {norm(x.get('nombre')) for x in result}
          for wanted in new_json:
              if norm(wanted) not in names:
                  raise SystemExit(f'No quedó incorporada: {wanted}')

          new_array = json.dumps(result, ensure_ascii=False, separators=(',', ':'))
          updated = html[:m.start(1)] + new_array + html[m.end(1):]
          if updated == html:
              raise SystemExit('No hubo cambios en FARMACIAS')
          path.write_text(updated, encoding='utf-8')
          Path('sync-result.txt').write_text(
              f'FARMACIAS_FINAL={len(result)}\nNUEVAS_ESPERADAS=3\n'
              + '\n'.join('- '+n for n in new_json) + '\n',
              encoding='utf-8'
          )
      - name: Commit only index change and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sync-result.txt .github/workflows/check-farmacias.yml sync-check.txt 2>/dev/null || true
          git rm -f .github/workflows/check-farmacias.yml sync-check.txt sync-result.txt 2>/dev/null || true
          git commit -m "Update pharmacy branches from current source" || true
          git push || true
