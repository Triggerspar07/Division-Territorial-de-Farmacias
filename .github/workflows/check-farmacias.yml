name: Check farmacias sync
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare current farmacias with updated source map
        shell: python
        run: |
          import json, re, urllib.request, unicodedata
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'const FARMACIAS = (\[.*?\]);\s*let currentDeptoIdx', html, re.S)
          if not m: raise SystemExit('No se encontró FARMACIAS')
          current = json.loads(m.group(1))
          src_html = urllib.request.urlopen('https://raw.githubusercontent.com/Triggerspar07/Mapa-de-DoctorSV/main/index.html', timeout=30).read().decode('utf-8')
          m2 = re.search(r'const SUCURSALES_REALES = (\[.*?\]);', src_html, re.S)
          if not m2: raise SystemExit('No se encontró SUCURSALES_REALES')
          src = json.loads(m2.group(1))
          src_f = [x for x in src if x.get('tipo') == 'farmacia']
          def norm(s):
              s = unicodedata.normalize('NFD', str(s or ''))
              s = ''.join(ch for ch in s if unicodedata.category(ch) != 'Mn')
              return re.sub(r'\s+', ' ', s).strip().lower()
          def key(x): return (norm(x.get('nombre')), norm(x.get('cadena')), norm(x.get('direccion')))
          cm={key(x):x for x in current}; sm={key(x):x for x in src_f}
          lines=[f'CURRENT_FARMACIAS={len(current)}',f'SOURCE_FARMACIAS={len(src_f)}',f'MATCHES={len(set(cm)&set(sm))}',f'MISSING_IN_CURRENT={len(set(sm)-set(cm))}',f'CURRENT_NOT_IN_SOURCE={len(set(cm)-set(sm))}']
          for k in sorted(set(sm)-set(cm)):
              x=sm[k]; lines.append('MISSING|'+str(x.get('nombre'))+'|'+str(x.get('cadena'))+'|'+str(x.get('direccion')))
          for k in sorted(set(cm)-set(sm)):
              x=cm[k]; lines.append('CURRENT_ONLY|'+str(x.get('nombre'))+'|'+str(x.get('cadena'))+'|'+str(x.get('direccion')))
          Path('sync-check.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Save report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync-check.txt
          git commit -m "Add pharmacy sync report" || true
          git push || true
